<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de conexión · Revisiones Fucesa</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;max-width:640px;margin:0 auto;padding:16px;color:#1b2430;background:#f3f5f8}
  h1{font-size:20px;color:#1F4E79;margin:0 0 4px}
  p{color:#555;font-size:14px}
  label{display:block;font-weight:bold;font-size:13px;margin:14px 0 4px}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:14px;border:1px solid #c5ccd6;border-radius:6px}
  button{margin-top:12px;padding:12px 16px;font-size:15px;font-weight:bold;border:0;border-radius:6px;background:#1F4E79;color:#fff;cursor:pointer;width:100%}
  .r{margin-top:10px;padding:10px;border-radius:6px;font-size:13px;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #c5ccd6;min-height:20px}
  .ok{border-color:#2e7d32;background:#edf7ee}
  .bad{border-color:#c62828;background:#fdecea}
</style>
</head>
<body>
<h1>Prueba de conexión</h1>
<p>Pega la URL de la aplicación web y el token (menú Revisiones &gt; Ver URL de la app y token). Pulsa las tres pruebas en orden.</p>

<label for="url">URL de la aplicación web (termina en /exec)</label>
<input id="url" placeholder="https://script.google.com/macros/s/.../exec">
<label for="token">Token</label>
<input id="token" placeholder="Token de 24 caracteres">

<button id="b1">1. Prueba de vida (GET sin token)</button>
<div class="r" id="r1"></div>
<button id="b2">2. Leer catálogos (GET con token)</button>
<div class="r" id="r2"></div>
<button id="b3">3. Enviar datos (POST text/plain)</button>
<div class="r" id="r3"></div>

<script>
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});}
function url(){return document.getElementById('url').value.trim().replace(/[?#].*$/,'').replace(/\/+$/,'');}
function tok(){return document.getElementById('token').value.trim();}
function show(id,ok,txt){const el=document.getElementById(id);el.className='r '+(ok?'ok':'bad');el.textContent=txt;}
async function run(id,fn){
  show(id,true,'Probando…');
  const u=url();
  if(!u){show(id,false,'La casilla de la URL está vacía. Pega ahí la URL que muestra el menú Revisiones > Ver URL de la app y token.');return;}
  if(/googleusercontent\.com/.test(u)){show(id,false,'Esa es la dirección a la que Google te redirige, no la URL de la app. Copia la URL desde el menú Revisiones > Ver URL de la app y token. Empieza con https://script.google.com/');return;}
  if(/\/dev$/.test(u)){show(id,false,'Esa URL termina en /dev (es la de pruebas del editor). Usa la que termina en /exec.');return;}
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){show(id,false,'La URL debe empezar con https://script.google.com/ y terminar en /exec.\n\nLo que pegaste:\n'+u);return;}
  const t0=Date.now();
  try{
    const res=await fn();
    const txt=await res.text();
    let j;try{j=JSON.parse(txt);}catch(e){show(id,false,'La respuesta no es JSON. Lo más probable: la implementación no tiene acceso "Cualquier usuario" o pide iniciar sesión.\n\nPrimeros caracteres:\n'+txt.slice(0,300));return;}
    show(id,!!j.ok,(j.ok?'CORRECTO':'RESPONDIÓ CON ERROR')+' en '+(Date.now()-t0)+' ms\n\n'+JSON.stringify(j,null,2).slice(0,1500));
  }catch(e){
    show(id,false,'FALLÓ: '+e.message+'\n\nRevisando la causa…');
    show(id,false,'FALLÓ: '+e.message+'\n\n'+await diagnostico(u));
  }
}
async function probar(u){
  try{const r=await fetch(u+'?accion=ping');const j=JSON.parse(await r.text());return j.ok?'ok':'json';}catch(e){return 'falla';}
}
async function diagnostico(u){
  const lineas=['Página abierta desde: '+location.protocol.replace(':','')];
  let alcanzable;
  try{await fetch(u+'?accion=ping',{mode:'no-cors'});alcanzable=true;}catch(e){alcanzable=false;}
  lineas.push('¿El servidor responde?: '+(alcanzable?'sí':'no'));
  const m=u.match(/^https:\/\/script\.google\.com\/a\/macros\/[^/]+\/(s\/.+\/exec)$/);
  if(m){
    const alt='https://script.google.com/macros/'+m[1];
    const r=await probar(alt);
    lineas.push('Prueba con la URL sin el dominio: '+(r==='ok'?'FUNCIONA':'también falla'));
    if(r==='ok'){
      lineas.push('\n✅ SOLUCIÓN: usa esta URL (sin "/a/macros/fucesa.com"):\n'+alt);
      document.getElementById('url').value=alt;
      return lineas.join('\n');
    }
  }
  if(!alcanzable) lineas.push('\nCAUSA PROBABLE: algo en esta computadora bloquea la conexión con Google (antivirus, extensión del navegador o red de la oficina). Prueba en otra red, por ejemplo con los datos del celular compartidos, o en otro navegador.');
  else lineas.push('\nCAUSA PROBABLE: Google responde, pero pide iniciar sesión antes de entregar la respuesta, así que el navegador la bloquea. Revisa en Implementar > Gestionar implementaciones que "Quién tiene acceso" diga "Cualquier usuario".');
  return lineas.join('\n');
}
document.getElementById('b1').onclick=()=>run('r1',()=>fetch(url()+'?accion=ping'));
document.getElementById('b2').onclick=()=>run('r2',()=>fetch(url()+'?accion=catalogos&token='+encodeURIComponent(tok())));
document.getElementById('b3').onclick=()=>run('r3',()=>fetch(url(),{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:'ping',token:tok(),uuid:uuid()})}));
</script>
</body>
</html>
